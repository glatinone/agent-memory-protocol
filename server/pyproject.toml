[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amp-server"
version = "0.1.0"
description = "Reference implementation of the AMP (Agent Memory Protocol) server"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "chromadb>=0.5.0",
    "python-ulid>=2.2.0",
    "mcp>=1.28.1,<2",
    # Runtime, not just for tests: the openai-compatible embedding provider
    # calls an /embeddings endpoint with it.
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "jsonschema>=4.20,<5",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
amp-server = "amp_server.main:main"
amp-mcp = "amp_server.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88
# Ruff also formats Python code fences inside Markdown. That rewrites prose
# files (READMEs, docs/) as a side effect of formatting code, and docs/ is not
# part of any CI path filter, so it would churn locally without being checked
# remotely. Keep the formatter on Python sources.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
files = ["amp_server"]
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
