name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Lint, format and type checks. Separate from the test jobs so a style or
  # typing failure reports in seconds instead of after a full matrix build.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint and type tooling
        # The SDK's langchain extra is installed on purpose: mypy only checks
        # amp_client/integrations/langchain.py against the real
        # BaseChatMessageHistory when langchain-core is importable. Without it
        # the module falls back to its local placeholder classes and mypy
        # silently stops checking the integration (and reports its
        # `# type: ignore[override]` as unused). CONTRIBUTING tells contributors
        # to install the same extra for the same reason.
        run: pip install -e "server[dev,postgres]" -e "sdk[dev,langchain]" -e "conformance[dev]"
      - name: Ruff lint (every Python package)
        run: ruff check server sdk conformance benchmarks
      - name: Ruff format check (every Python package)
        run: ruff format --check server sdk conformance benchmarks

      # The benchmark harness is not a gate on timing - a shared runner cannot
      # produce a meaningful number - but it is a gate on the harness working.
      # Without this a broken script rots quietly until somebody needs it.
      - name: Benchmark harness runs
        run: python benchmarks/run.py --sizes 20 --queries 2
      - name: mypy (server)
        working-directory: server
        run: mypy
      - name: mypy (sdk)
        working-directory: sdk
        run: mypy
      - name: mypy (conformance)
        working-directory: conformance
        run: mypy

  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install server package
        working-directory: server
        run: pip install -e ".[dev]"
      # One process per test file - the discipline `scripts/run_tests.sh` enforces
      # in the project this repo borrows its test practice from, and for the same
      # reason. Two files here reached the app through state a *previous* file had
      # left on the module: they passed in a single-process run and failed the
      # moment one file was run alone. The shell already runs with `-e`, so the
      # loop stops at the first failing file.
      - name: Run server tests (one process per file)
        working-directory: server
        run: |
          for f in tests/test_*.py; do
            echo "::group::$f"
            pytest -q "$f"
            echo "::endgroup::"
          done
      - name: Security scan (pip-audit)
        working-directory: server
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # 3.10 is the floor declared in pyproject.toml `requires-python`, so it
        # is tested rather than only asserted.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK package
        working-directory: sdk
        run: pip install -e ".[dev,langchain]"

      # The client tests that matter most are the ones against a real server:
      # every mock-based test in this package passed while `forget` on the async
      # client could not work at all.
      - name: Install the reference server
        if: matrix.python-version != '3.10'
        working-directory: server
        run: pip install -e .

      - name: Start the reference server
        if: matrix.python-version != '3.10'
        working-directory: server
        run: |
          uvicorn amp_server.main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/amp/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/amp/v1/health

      - name: Run SDK tests (unit)
        working-directory: sdk
        run: pytest -v python/tests --ignore=python/tests/test_live_client.py

      # Not run on 3.10: the reference server's own floor is 3.11, so that leg has
      # nothing to talk to. The condition is explicit rather than a skip, because a
      # skip would read as a pass.
      - name: Run the SDK against a real server
        if: matrix.python-version != '3.10'
        working-directory: sdk
        env:
          # A skip here would report green while the client went unexercised - the
          # same reason the storage job fails when its Postgres is missing.
          AMP_REQUIRE_LIVE_SERVER: "1"
        run: pytest -v python/tests/test_live_client.py
      - name: Security scan (pip-audit)
        working-directory: sdk
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

  sdk-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
        # 18 is the floor declared in package.json engines; 20 and 22 are the
        # current LTS lines. Top of the range is capped deliberately: Node 24
        # is not in the stable release channel matrix every runner carries yet.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server (to test the client against a real AMP server)
        working-directory: server
        run: pip install -e .

      - name: Start AMP server
        working-directory: server
        run: |
          uvicorn amp_server.main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/amp/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/amp/v1/health

      # The Node client has no dependencies, so there is nothing to install.
      - name: Run Node SDK tests
        working-directory: sdk/node
        run: node --test test/client.test.js

  # Exercises the Postgres backend against a real database. The adapter cannot be
  # verified on a machine without Postgres, so the proof lives here: a service
  # container, and AMP_REQUIRE_POSTGRES so the suite cannot pass by skipping.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the server with the postgres extra
        working-directory: server
        run: pip install -e ".[dev,postgres]"

      - name: Run the storage backend contract suite against Postgres
        working-directory: server
        env:
          AMP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/amp
          AMP_REQUIRE_POSTGRES: "1"
        run: pytest -v tests/test_adapter_contract.py

  # Runs the conformance suite against the reference server, so the repository
  # is checked against the specification rather than only against itself.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the reference server and the suite
        run: pip install -e "server[dev]" -e "conformance[dev]"

      - name: Start the reference server
        working-directory: server
        run: |
          uvicorn amp_server.main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/amp/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/amp/v1/health

      # Fails on any vector the server does not satisfy, and on a case marked
      # as a known gap that has started passing.
      - name: Conformance suite against the reference server
        run: amp-conformance --base-url http://127.0.0.1:8765

      - name: Conformance suite unit tests
        working-directory: conformance
        run: pytest -q
